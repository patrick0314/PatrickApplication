<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="troubleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <!-- Card base -->
  <rect x="2" y="2" width="76" height="76" rx="16" fill="url(#troubleBg)" stroke="#f472b6" stroke-width="2.5"/>
  <!-- Juggling / Swapping Energy Arcs -->
  <path d="M22 24 Q40 12 58 24" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M58 56 Q40 68 22 56" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="56,22 62,24 58,28" fill="#fef08a"/>
  <polygon points="24,58 18,56 22,52" fill="#fef08a"/>
  <!-- Comedy Theater Mask (Left) -->
  <g transform="translate(14, 24) rotate(-10)">
    <path d="M6 4 Q16 0 24 6 Q28 18 20 26 Q12 30 6 22 Q0 14 6 4 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Smiling eyes -->
    <path d="M8 10 Q11 6 14 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 12 Q19 8 22 12" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Big grin -->
    <path d="M9 18 Q15 26 21 18 Z" fill="#e11d48"/>
  </g>
  <!-- Tragedy / Mischief Mask (Right) -->
  <g transform="translate(42, 28) rotate(12)">
    <path d="M6 4 Q16 0 24 6 Q28 18 20 26 Q12 30 6 22 Q0 14 6 4 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Winking / Mischief eyes -->
    <path d="M8 12 Q11 16 14 12" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <polygon points="17,10 21,12 18,14" fill="#1e293b"/>
    <!-- Quirky mouth -->
    <path d="M10 22 Q16 16 22 20" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
