<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <linearGradient id="backBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Card base -->
  <rect x="2" y="2" width="116" height="176" rx="14" fill="url(#backBg)" stroke="url(#goldBorder)" stroke-width="3"/>
  <!-- Inner filigree border -->
  <rect x="8" y="8" width="104" height="164" rx="10" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  <!-- Corner ornaments -->
  <circle cx="15" cy="15" r="3" fill="#fbbf24"/>
  <circle cx="105" cy="15" r="3" fill="#fbbf24"/>
  <circle cx="15" cy="165" r="3" fill="#fbbf24"/>
  <circle cx="105" cy="165" r="3" fill="#fbbf24"/>
  <!-- Center circle & moon -->
  <circle cx="60" cy="90" r="38" fill="url(#moonGlow)"/>
  <circle cx="60" cy="90" r="30" fill="#1e1b4b" stroke="url(#goldBorder)" stroke-width="2"/>
  <!-- Crescent Moon -->
  <path d="M60 70 A20 20 0 1 0 74 104 A16 16 0 1 1 60 70 Z" fill="#fbbf24"/>
  <!-- Stars -->
  <circle cx="45" cy="80" r="1.5" fill="#ffffff"/>
  <circle cx="72" cy="76" r="1.5" fill="#ffffff"/>
  <circle cx="75" cy="98" r="1.5" fill="#ffffff"/>
  <!-- Title label ONUW -->
  <text x="60" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="900" fill="#a5b4fc" text-anchor="middle" letter-spacing="3">ONE NIGHT</text>
</svg>
