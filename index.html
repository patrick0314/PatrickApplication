<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My App</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My App">
  <meta name="theme-color" content="#4338ca">
  <meta name="description" content="個人專屬自訂微應用工作站">

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Mobile Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Global Toast Notification Banner -->
  <div id="global-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2 px-4 py-2.5 rounded-full bg-slate-900/90 dark:bg-white/90 text-white dark:text-slate-900 shadow-xl backdrop-blur-md text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-4">
    <span id="toast-icon"></span>
    <span id="toast-message">訊息提示</span>
  </div>

  <!-- Global Floating Reactions Container (Anchored to Viewport) -->
  <div id="global-floating-reactions" class="pointer-events-none fixed inset-x-0 bottom-0 top-0 max-w-md mx-auto z-50 overflow-hidden"></div>

  <!-- Main Mobile App Shell -->
  <div class="flex-1 flex flex-col max-w-md mx-auto w-full relative">

    <!-- Top Safe Area Header Bar: [Icon] 暱稱's App (Left) | Date Hour:Min (Right, No Settings Button) -->
    <header class="sticky top-0 z-30 glass-nav border-b border-slate-200/50 dark:border-slate-800/50 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2 shrink-0">
        <div class="h-7 w-7 rounded-xl bg-gradient-to-tr from-indigo-700 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-indigo-600/30">
          <i data-lucide="app-window" class="w-4 h-4"></i>
        </div>
        <span id="app-header-title" class="font-black text-base tracking-tight text-slate-800 dark:text-slate-100 truncate">default's App</span>
      </div>

      <!-- Live Date & Time with Hour & Minute -->
      <div>
        <span id="app-header-date" class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"></span>
      </div>
    </header>

    <!-- Main Dynamic Module Container -->
    <main id="module-content" class="flex-1 px-4 pt-3 overflow-y-auto no-scrollbar">
      <!-- Content dynamically rendered by modules -->
    </main>

    <!-- Fixed Bottom Mobile Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-nav border-t border-slate-200/60 dark:border-slate-800/60 bottom-nav">
      <div class="max-w-md mx-auto flex items-center justify-around px-4 py-1" id="bottom-nav-items">
        <!-- Rendered by App.renderNav() -->
      </div>
    </nav>
  </div>

  <!-- Vendor Libraries -->
  <script src="js/vendor/mqtt.min.js"></script>

  <!-- Core Scripts & Modules -->
  <script src="js/storage.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/werewolf.js"></script>
  <script src="js/modules/codenames.js"></script>
  <script src="js/modules/arthur.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
