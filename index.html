<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LifeHub - 個人隨身工作站</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeHub">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="專屬個人的離線模組化掌上工作站">

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Mobile Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Global Toast Notification Banner -->
  <div id="global-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2 px-4 py-2.5 rounded-full bg-slate-900/90 dark:bg-white/90 text-white dark:text-slate-900 shadow-xl backdrop-blur-md text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-4">
    <span id="toast-icon"></span>
    <span id="toast-message">訊息提示</span>
  </div>

  <!-- Main Mobile App Shell -->
  <div class="flex-1 flex flex-col max-w-md mx-auto w-full relative">

    <!-- Top Safe Area Header Bar -->
    <header class="sticky top-0 z-30 glass-nav border-b border-slate-200/50 dark:border-slate-800/50 px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="h-7 w-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black text-xs shadow-sm">
          LH
        </div>
        <span class="font-extrabold text-sm tracking-tight text-slate-800 dark:text-slate-100">LifeHub</span>
        <span class="text-[10px] bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-semibold px-1.5 py-0.5 rounded">
          微應用
        </span>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="App.openNewTaskModal()" class="h-8 w-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 tap-scale">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Module Container -->
    <main id="module-content" class="flex-1 px-4 pt-3 overflow-y-auto no-scrollbar">
      <!-- Content dynamically rendered by modules (Dashboard, Tasks, Settings, etc.) -->
    </main>

    <!-- Fixed Bottom Mobile Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-nav border-t border-slate-200/60 dark:border-slate-800/60 bottom-nav">
      <div class="max-w-md mx-auto flex items-center justify-around px-2 py-1" id="bottom-nav-items">
        <!-- Tab buttons rendered by App.renderNav() -->
      </div>
    </nav>
  </div>

  <!-- Task Add / Edit Modal Drawer -->
  <div id="task-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center hidden">
    <!-- Backdrop -->
    <div onclick="App.closeModal()" class="modal-overlay fixed inset-0 bg-black/50 backdrop-blur-sm opacity-0"></div>

    <!-- Modal Content Drawer -->
    <div class="modal-content relative w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl z-10 transform translate-y-full max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <h3 id="modal-title" class="font-bold text-base text-slate-900 dark:text-white">新增事項</h3>
        <button onclick="App.closeModal()" class="p-1 rounded-full text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="task-form" onsubmit="App.handleTaskFormSubmit(event)" class="mt-4 space-y-4">
        <input type="hidden" id="task-id-input" value="">

        <!-- Title -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">事項名稱 *</label>
          <input 
            type="text" 
            id="task-title-input" 
            required 
            placeholder="例如：完成運動、整理會議筆記..." 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
          />
        </div>

        <!-- Quick Category Select -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">分類標籤</label>
          <input 
            type="text" 
            id="task-category-input" 
            value="生活" 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
          />
          <div class="flex space-x-1.5 mt-2 overflow-x-auto no-scrollbar">
            <button type="button" onclick="App.setCategoryPreset('工作')" class="px-2.5 py-1 text-[11px] rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600">💼 工作</button>
            <button type="button" onclick="App.setCategoryPreset('生活')" class="px-2.5 py-1 text-[11px] rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600">🏠 生活</button>
            <button type="button" onclick="App.setCategoryPreset('學習')" class="px-2.5 py-1 text-[11px] rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600">📚 學習</button>
            <button type="button" onclick="App.setCategoryPreset('健康')" class="px-2.5 py-1 text-[11px] rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600">🏃 健康</button>
            <button type="button" onclick="App.setCategoryPreset('重要')" class="px-2.5 py-1 text-[11px] rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600">⭐ 重要</button>
          </div>
        </div>

        <!-- Priority & Due Date -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">優先級</label>
            <select id="task-priority-input" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:outline-none">
              <option value="low">普通優先</option>
              <option value="medium" selected>中優先</option>
              <option value="high">高優先級 🚨</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">預計完成日</label>
            <input type="date" id="task-date-input" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:outline-none">
          </div>
        </div>

        <!-- Notes -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">備註說明 (選填)</label>
          <textarea 
            id="task-notes-input" 
            rows="3" 
            placeholder="補充具體細節、備忘或清單..." 
            class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit" class="tap-scale w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-1.5">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>儲存事項</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Application Logic Modules -->
  <script src="js/storage.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/tasks.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
